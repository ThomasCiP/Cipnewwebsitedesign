<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>Christians in Politics Australia | Faith in Public Life</title>

      name="description"
      content="Christians in Politics (CiP) is a non-partisan Australian network encouraging Christians to engage relationally in public life. Invite us to your church or campus, or join our network."
    />
    <link rel="canonical" href="https://www.christiansinpolitics.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a1a" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Christians in Politics" />
    <meta property="og:title" content="Christians in Politics Australia" />
    <meta
      property="og:description"
      content="A non-partisan Australian network encouraging Christians to engage relationally in public life."
    />
    <meta property="og:url" content="https://www.christiansinpolitics.com/" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Christians in Politics Australia" />

      name="twitter:description"
      content="A non-partisan Australian network encouraging Christians to engage relationally in public life."
    />
    <meta name="twitter:image" content="https://www.christiansinpolitics.com/favicon.png" />

      {
        "@context": "https://schema.org",

        "name": "Christians in Politics",
        "alternateName": "CiP",
        "url": "https://www.christiansinpolitics.com/",

        "areaServed": "AU",
        "description": "A non-partisan Australian network encouraging Christians to engage relationally in public life.",

      }
